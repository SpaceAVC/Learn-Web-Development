<!DOCTYPE html>
<!-- STEP 1: Document type declaration — tells the browser this is HTML5 -->
<html lang="en">
  <!-- STEP 2: <html> is the root element. lang="en" helps screen readers 
       and search engines know the page language -->

  <head>
    <!-- STEP 3: <head> holds meta info — nothing here is visible on the page itself -->

    <meta charset="utf-8" />
    <!-- STEP 4: Sets character encoding so special characters (é, —, etc.) render correctly -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- STEP 5: Makes the page responsive — matches page width to device width, 
         critical for mobile display -->

    <title>Cafe Menu</title>
    <!-- STEP 6: Text shown on the browser tab -->

    <link href="styles.css" rel="stylesheet" />
    <!-- STEP 7: Links the EXTERNAL CSS file. rel="stylesheet" tells the browser 
         "treat this file as CSS". This is why nothing here needs a <style> tag -->
  </head>

  <body>
    <!-- STEP 8: <body> holds everything the user actually sees -->

    <div class="menu">
      <!-- STEP 9: Outer wrapper. In CSS this is targeted by .menu — 
           gives the whole card its background color, width, and centering -->

      <main>
        <!-- STEP 10: <main> = semantic tag for the primary content of the page 
             (as opposed to nav/footer/aside) -->

        <h1>CAMPER CAFE</h1>
        <!-- STEP 11: Main heading. Styled by h1 rule (font-size, Impact font) -->

        <p class="established">Est. 2020</p>
        <!-- STEP 12: Styled by .established → italic text -->

        <hr>
        <!-- STEP 13: Horizontal divider line. Styled by hr rule → thick brown line -->

        <section>
          <!-- STEP 14: First menu section — groups Coffee heading + image + items -->

          <h2>Coffee</h2>
          <!-- STEP 15: Section heading, styled by h2 rule -->

          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon"/>
          <!-- STEP 16: Section icon. alt text describes image for accessibility/if image fails.
               Styled by img rule → centered, negative top margin pulls it closer to h2 -->

          <article class="item">
            <!-- STEP 17: One menu row = one <article>. Repeated for every item.
                 .item class controls spacing of the <p> tags inside -->
            <p class="flavor">French Vanilla</p><p class="price">3.00</p>
            <!-- STEP 18: Two inline-block paragraphs side by side:
                 .flavor (left-aligned, 75% width) + .price (right-aligned, 25% width)
                 → creates the "name .......... price" menu row effect -->
          </article>

          <article class="item">
            <p class="flavor">Caramel Macchiato</p><p class="price">3.75</p>
          </article>
          <article class="item">
            <p class="flavor">Pumpkin Spice</p><p class="price">3.50</p>
          </article>
          <article class="item">
            <p class="flavor">Hazelnut</p><p class="price">4.00</p>
          </article>
          <article class="item">
            <p class="flavor">Mocha</p><p class="price">4.50</p>
          </article>
        </section>

        <section>
          <!-- STEP 19: Second section — same structure as Coffee, but uses 
               .dessert instead of .flavor for the item name -->
          <h2>Desserts</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon"/>

          <article class="item">
            <p class="dessert">Donut</p><p class="price">1.50</p>
          </article>
          <article class="item">
            <p class="dessert">Cherry Pie</p><p class="price">2.75</p>
          </article>
          <article class="item">
            <p class="dessert">Cheesecake</p><p class="price">3.00</p>
          </article>
          <article class="item">
            <p class="dessert">Cinnamon Roll</p><p class="price">2.50</p>
          </article>
        </section>
      </main>

      <hr class="bottom-line">
      <!-- STEP 20: Second divider, but with an EXTRA class .bottom-line
           → same hr styling PLUS margin-top: 25px for spacing above footer -->

      <footer>
        <!-- STEP 21: Semantic tag for closing/contact info. 
             Styled by footer rule → smaller font-size -->

        <address>
          <!-- STEP 22: Semantic tag for contact info. 
               Browsers italicize <address> by default, so CSS resets it 
               with font-style: normal -->

          <p>
            <a href="https://www.freecodecamp.org" target="_blank">Visit our website</a>
            <!-- STEP 23: Link opens in new tab (target="_blank").
                 Styled by a, a:visited, a:hover, a:active → stays black normally, 
                 turns brown on hover/click -->
          </p>
          <p class="address">123 Free Code Camp Drive</p>
          <!-- STEP 24: Styled by .address → just adds margin-bottom for spacing -->
        </address>
      </footer>
    </div>
  </body>
</html>
