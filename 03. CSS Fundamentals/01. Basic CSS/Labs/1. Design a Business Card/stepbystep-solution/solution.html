<!DOCTYPE html>
<!-- 1. This line tells the browser "this is a modern HTML5 page". Always the very first line. -->
<html lang="en">
<!-- 2. <html> is the main box that holds the whole page. lang="en" tells browsers/screen readers the page is in English. -->

    <head>
        <!-- 3. <head> holds information ABOUT the page (title, links to CSS, settings). Nothing inside <head> shows up directly on the page. -->

        <meta charset="UTF-8">
        <!-- 4. This tells the browser which letters/symbols to use so text (including special characters) displays correctly. -->

        <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
        <!-- 5. This makes the page look correct on phones and tablets, not just computers. It tells the page to match the screen's width and start at normal zoom. -->

        <title>Business card</title>
        <!-- 6. This text shows up in the browser tab at the top. It does NOT appear on the page itself. -->

        <link rel="stylesheet" href="./solution.css" />
        <!-- 7. This connects this HTML file to the CSS file named "styles.css". This is how all the colors/spacing/sizes get applied. Without this line the page would look plain and unstyled. -->

    </head>
    <!-- 8. This closes the <head> section. Everything after this is what actually shows on the page. -->

    <body>
        <!-- 9. <body> holds everything the user actually SEES on the webpage: text, images, links, etc. -->

        <div class="business-card">
            <!-- 10. <div> is just a container/box used to group things together.
                class="business-card" gives this box a name/label so CSS can find it and style it
                (see styles.css step 3 where ".business-card" is styled). This box wraps the ENTIRE card. -->

            <img class="profile-image" src="1.png" alt="A beautiful flower.">
            <!-- 11. <img> shows a picture.
                src="1.png" tells the browser WHICH image file to load (must be in the same folder as this HTML file).
                alt="..." is backup text shown if the image fails to load, and it's also read aloud by screen readers.
                class="profile-image" labels this image so CSS can style it (see styles.css step 4). -->

            <p class="full-name">Basketronics</p>
            <!-- 12. <p> means "paragraph" - it's used here to show a line of text: the person's/brand's name.
                class="full-name" labels this text so CSS can style it (see styles.css step 5, makes it big and dark). -->

            <p class="designation">Software Developer</p>
            <!-- 13. Another paragraph, this one shows the job title.
                class="designation" labels it for CSS styling (see styles.css step 6, makes it grey and medium-sized). -->

            <p class="company">@basket</p>
            <!-- 14. Another paragraph, showing the company/handle name.
                class="company" labels it for CSS styling (see styles.css step 7, makes it light grey). -->

            <hr />
            <!-- 15. <hr> draws a horizontal line across the page, used to visually separate sections
                (here it separates the name/title area from the contact info area).
                Styled in styles.css step 8. -->

            <p class="mail">mail-me@example.com</p>
            <!-- 16. Paragraph showing the email address. class="mail" is used by CSS (see styles.css, uses the general "p" rule in step 10). -->

            <p class="phone-no">(91) 2349234234</p>
            <!-- 17. Paragraph showing the phone number. Same styling idea as above. -->

            <a class="portfolio-link" href="https://github.com/spaceavc/portfolio">Portfolio</a>
            <!-- 18. <a> makes a clickable link (anchor tag).
                href="..." is the WEB ADDRESS the link goes to when clicked.
                "Portfolio" is the clickable text the user sees.
                class="portfolio-link" is a label (not specifically styled in the CSS below, but could be later).
                This whole link is affected by the general "a" rule (see styles.css step 11) which removes the underline. -->
            <hr />
            <!-- 19. Another horizontal line, separating contact info from the social media section below. -->

            <div class="social-media">
                <!-- 20. Another container box, this time grouping the "Connect with me" heading and social links together.
                    class="social-media" labels it for CSS (see styles.css step 9, adds spacing). -->

                <h2>Connect with me</h2>
                <!-- 21. <h2> is a heading (bigger, bolder text automatically, browser default styling), used here as a small section title. -->

                <p class="social-media-links">
                <!-- 22. Paragraph that will hold all three social media links together on one line. -->

                    <a href="https://x.com/SpaceAvc">Twitter</a>
                    <!-- 23. A clickable link to a Twitter/X profile. Text shown to the user is "Twitter". -->

                    <a href="https://www.linkedIn.com/">LinkedIn</a>
                    <!-- 24. A clickable link to LinkedIn. Text shown to the user is "LinkedIn". -->

                    <a href="https://github.com/SpaceAVC/Learn-Web-Development">GitHub</a>
                    <!-- 25. A clickable link to a GitHub page. Text shown to the user is "GitHub".
                        All three of these links above are styled together by ".social-media a" in styles.css step 12
                        (this makes them dark red and adds spacing between them). -->

            </div>
            <!-- 26. This closes the "social-media" div (box) that was opened in step 20.
                NOTE: the closing </p> tag for the paragraph opened in step 22 is missing here in the original code —
                browsers usually still display it fine, but it's good practice to close every tag you open. -->

        </div>
        <!-- 27. This closes the "business-card" div (box) that was opened in step 10. Everything inside the card ends here. -->

    </body>
    <!-- 28. This closes the <body> section opened in step 9. -->

</html>
<!-- 29. This closes the <html> box opened in step 2. This is the very last line of the file. -->
