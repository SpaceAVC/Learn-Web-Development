<!DOCTYPE html>
<!-- 1. This tells the browser: "read this page as modern HTML5". Always goes first. -->
<html lang="en">
<!-- 2. <html> is the root of the whole page. lang="en" tells browsers/screen readers the page is in English. -->

    <head>
        <!-- 3. <head> holds info ABOUT the page (not visible content) - like settings, title, and CSS link. -->

        <meta charset="UTF-8">
        <!-- 4. Sets the character encoding so letters, symbols, emojis etc. show up correctly. -->

        <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />
        <!-- 5. Makes the page responsive: it tells mobile browsers to match the screen's width and not zoom in automatically. -->

        <title>TO-Do</title>
        <!-- 6. Text shown on the browser tab and in search results. -->

        <link rel="stylesheet" href="./solution.css" />
        <!-- 7. Connects this HTML file to the CSS file so all the styling rules apply. -->
    </head>

    <body>
        <!-- 8. <body> holds everything the user actually SEES on the page. -->

        <div class="container">
        <!-- 9. A <div> is a generic box used to group content together. class="container" lets CSS style this box (the white card). -->

        <h1>MY To-Do LIST</h1>
        <!-- 10. <h1> is the biggest heading tag, used for the main title of the page. -->

            <ul class="todo-list">
            <!-- 11. <ul> = "unordered list" (a bullet-point list). class="todo-list" lets CSS remove bullets and style it. -->

                <li><input type="checkbox" id="1task" ><label for="1task">Learn more about CSS.</label>
                <!-- 12. <li> = one list item (one task row).
                     13. <input type="checkbox"> creates a clickable checkbox. id="1task" gives it a unique name.
                     14. <label for="1task"> links this text to the checkbox above using the matching id, so clicking the TEXT also checks the box (better usability). -->
                    <ul class="sub-item">
                    <!-- 15. A second, nested <ul> inside the task - a mini list just for the link below it. -->
                        <li><a class="sub-item-link" href="/a" target="_blank" >Note Link</a></li>
                        <!-- 16. <a> = anchor tag, creates a clickable link. href="/a" is the destination URL.
                             17. target="_blank" opens the link in a NEW browser tab. -->
                    </ul>
                </li>

                <li><input type="checkbox" id="2task" ><label for="2task">Lecture in details about CSS.</label>
                <!-- 18. Second task, same pattern as task 1 but with id="2task" so it's a separate, independent checkbox. -->
                    <ul class="sub-item">
                        <li><a class="sub-item-link" href="/a" target="_blank" >Lecture Resources</a></li>
                    </ul>
                </li>

                <li><input type="checkbox" id="3task" ><label for="3task">Make 2 projects using CSS.</label>
                <!-- 19. Third task, id="3task". -->
                    <ul class="sub-item">
                        <li><a class="sub-item-link" href="/a" target="_blank" >Projects files</a></li>
                    </ul>
                </li>

                <li><input type="checkbox" id="4task" ><label for="4task">Push in GitHub.</label>
                <!-- 20. Fourth task, id="4task". -->
                    <ul class="sub-item">
                        <li><a class="sub-item-link" href="/a" target="_blank" >Repositories</a></li>
                        <!-- 21. (Fixed) this used to be a broken closing tag </>, now correctly closed as </a>. -->
                    </ul>
                </li>
            </ul>
        </div>
        
    </body>
</html>
