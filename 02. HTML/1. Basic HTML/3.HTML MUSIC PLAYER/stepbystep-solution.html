<!DOCTYPE html>
<!-- 1. This line tells the browser we are using HTML5 -->
<html lang="en">
<head>
    <!-- 2. Sets the character encoding so text and symbols show correctly -->
    <meta charset="UTF-8">

    <!-- 3. Viewport meta tag: makes the page look good on phones and tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 4. The title that shows on the browser tab -->
    <title>Working with the HTML Audio Element</title>
</head>
<body>
    <!-- 5. Main heading of the page -->
    <h1>freeCodeCamp Tunes</h1>

    <!-- 6. Heading for the first song -->
    <h2>Can't Stay Down</h2>
    <!-- 7. Artist name for the first song -->
    <p>Artist: Quincy Larson</p>

    <!-- 8. Audio player for the first song: "loop" repeats it, "controls" shows play/pause/volume buttons -->
    <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/can't-stay-down.mp3" loop controls></audio>

    <!-- 9. Heading for the second song -->
    <h2>Cruising for a Musing</h2>
    <!-- 10. Artist name for the second song -->
    <p>Artist: Quincy Larson</p>

    <!-- 11. Audio player for the second song -->
    <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/cruising-for-a-musing.mp3" loop controls></audio>

    <!-- 12. Heading for the third song -->
    <h2>Scratching the Surface</h2>
    <!-- 13. Artist name for the third song -->
    <p>Artist: Quincy Larson</p>

    <!-- 14. Audio player for the third song (same "controls" and "loop", just written in a different order) -->
    <audio src="https://cdn.freecodecamp.org/curriculum/js-music-player/scratching-the-surface.mp3" controls loop></audio>

</body>
</html>
